<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klasse 7.3</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#d6d2c7;--accent:#2f6fde}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--card:#1e222a;--ink:#e8e9ec;--muted:#9aa1ad;--line:#363b46;--accent:#6b9cff}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:1.6rem}
a.tool{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  color:var(--ink);text-decoration:none;margin-top:12px}
a.tool:hover{border-color:var(--accent)}
a.tool b{font-size:1.15rem}
a.tool span{display:block;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<main>
  <h1>Klasse 7.3</h1>
  <a class="tool" href="schaetzspiel/">
    <b>🎯 Prozent-Schätzspiel</b>
    <span>Mit 2 W10 eine Prozentzahl würfeln und schätzen, wo sie liegt.</span>
  </a>
  <a class="tool" href="farbtaeuschung/">
    <b>🎨 Farb-Täuschung</b>
    <span>Karten nach Farbanteil ordnen – und Täuschungen entlarven.</span>
  </a>
</main>
</body>
</html>
