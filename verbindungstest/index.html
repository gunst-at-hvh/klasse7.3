<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbindungstest</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#25104f;color:#fff;padding:16px}
.card{background:#fff;color:#1d2433;border-radius:16px;padding:16px;max-width:640px;margin:0 auto 14px}
h1{font-size:1.4rem;margin:0 0 6px}
button{font:inherit;font-weight:800;border:none;border-radius:12px;padding:12px 16px;background:#1368ce;color:#fff;cursor:pointer;margin:4px 0}
input{font:inherit;font-size:1.6rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:10px;border-radius:10px;border:2px solid #ccc;width:9em}
.code{font-size:3rem;font-weight:900;letter-spacing:.15em;color:#46178f}
#log{font-family:ui-monospace,monospace;font-size:.85rem;white-space:pre-wrap;line-height:1.45}
.ok{color:#26890c;font-weight:700}.bad{color:#e21b3c;font-weight:700}.mid{color:#b07800;font-weight:700}
.sum{font-size:1.1rem;font-weight:800;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>🔌 Verbindungstest</h1>
  <div>Am <b>PC</b>: „Test-Raum öffnen“. Am <b>Handy</b>: Code eingeben und „Verbinden“.</div>
  <div style="margin-top:10px">
    <button id="hostBtn">🖥️ Test-Raum öffnen</button>
    <div id="hostBox" style="display:none">Code: <span class="code" id="code">····</span></div>
  </div>
  <div style="margin-top:10px">
    <input id="joinCode" placeholder="CODE" maxlength="6"> <button id="joinBtn">📱 Verbinden</button>
  </div>
  <div class="sum" id="sum"></div>
</div>
<div class="card">
  <b>Protokoll</b> <button id="copyBtn" style="padding:4px 10px;font-size:.85rem;background:#888">kopieren</button>
  <div id="log"></div>
</div>
<script src="../schaetzspiel-live/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const OPTS = Q.get('ph') ? {host:Q.get('ph'), port:+(Q.get('pp')||9000), path:'/', secure:Q.get('ps')==='1'} : {};
OPTS.debug = 1;
const PREFIX = 'hvh-verbtest-';
const t0 = Date.now();
function log(msg, cls){ const s = ((Date.now()-t0)/1000).toFixed(1).padStart(5) + 's  ' + msg; const d = document.createElement('div'); d.textContent = s; if (cls) d.className = cls; $('log').appendChild(d); }
function sum(msg, cls){ $('sum').textContent = msg; $('sum').className = 'sum ' + (cls||''); }
log('Gerät: ' + navigator.userAgent);
log('Seite: ' + location.href);
if (typeof Peer === 'undefined'){ log('✗ Verbindungs-Bibliothek nicht geladen!', 'bad'); }

// WebRTC-Details einer Verbindung beobachten
function watch(conn, who){
  const pc = conn.peerConnection;
  if (!pc){ setTimeout(() => watch(conn, who), 200); return; }
  const types = new Set();
  pc.addEventListener('icecandidate', e => {
    if (e.candidate && e.candidate.candidate){
      const m = / typ (\w+)/.exec(e.candidate.candidate); const ty = m ? m[1] : '?';
      if (!types.has(ty)){ types.add(ty); log(`  ${who}: Weg gefunden: ${ty === 'host' ? 'direkt im Netz (host)' : ty === 'srflx' ? 'über Router/Internet (srflx)' : ty === 'relay' ? 'Umleitungs-Server (relay)' : ty}`, ty === 'relay' ? 'ok' : ''); }
    } else if (!e.candidate){ log(`  ${who}: Wegsuche fertig. Gefunden: ${[...types].join(', ') || 'nichts'}`, types.has('relay') ? 'ok' : 'mid'); }
  });
  pc.addEventListener('iceconnectionstatechange', () => {
    const st = pc.iceConnectionState;
    log(`  ${who}: ICE-Status: ${st}`, st === 'connected' || st === 'completed' ? 'ok' : st === 'failed' ? 'bad' : '');
    if (st === 'failed') sum('✗ Die Geräte finden keinen gemeinsamen Weg (ICE failed). Ein funktionierender Umleitungs-Server fehlt.', 'bad');
  });
  pc.addEventListener('connectionstatechange', () => log(`  ${who}: Verbindungs-Status: ${pc.connectionState}`));
  setTimeout(async () => {
    try {
      const stats = await pc.getStats(); stats.forEach(r => {
        if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated){
          const loc = stats.get(r.localCandidateId), rem = stats.get(r.remoteCandidateId);
          log(`  ${who}: Genutzter Weg: ${loc && loc.candidateType} ↔ ${rem && rem.candidateType}`, 'ok');
        }
      });
    } catch(e){}
  }, 6000);
}

$('hostBtn').onclick = () => {
  $('hostBtn').disabled = true;
  const code = [...Array(4)].map(() => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  log('Öffne Test-Raum ' + code + ' …');
  const peer = new Peer(PREFIX + code, OPTS);
  peer.on('open', id => { log('✓ Vermittlung erreicht (Raum-ID ' + id + ')', 'ok'); $('hostBox').style.display = ''; $('code').textContent = code; sum('Warte auf das Handy …'); });
  peer.on('connection', conn => {
    log('→ Ein Gerät klopft an …'); watch(conn, 'PC');
    conn.on('open', () => { log('✓ Datenverbindung offen!', 'ok'); sum('✅ Verbindung steht!', 'ok'); conn.send('hallo vom PC'); });
    conn.on('data', d => log('✓ Nachricht erhalten: ' + d, 'ok'));
    conn.on('error', e => log('✗ Verbindungsfehler: ' + e, 'bad'));
    conn.on('close', () => log('Verbindung geschlossen', 'mid'));
  });
  peer.on('error', e => { log('✗ Fehler: ' + e.type + ' – ' + e.message, 'bad'); if (e.type !== 'peer-unavailable') sum('✗ Vermittlung nicht erreichbar: ' + e.type, 'bad'); });
  peer.on('disconnected', () => log('Vermittlung getrennt', 'mid'));
};
$('joinBtn').onclick = () => {
  const code = $('joinCode').value.trim().toUpperCase(); if (code.length < 4) return;
  $('joinBtn').disabled = true;
  log('Verbinde mit Raum ' + code + ' …');
  const peer = new Peer(undefined, OPTS);
  peer.on('open', id => {
    log('✓ Vermittlung erreicht (eigene ID ' + id.slice(0,8) + '…)', 'ok');
    const conn = peer.connect(PREFIX + code, {reliable:true}); watch(conn, 'Handy');
    conn.on('open', () => { log('✓ Datenverbindung offen!', 'ok'); sum('✅ Verbindung steht!', 'ok'); conn.send('hallo vom Handy'); });
    conn.on('data', d => log('✓ Nachricht erhalten: ' + d, 'ok'));
    conn.on('error', e => log('✗ Verbindungsfehler: ' + e, 'bad'));
    conn.on('close', () => log('Verbindung geschlossen', 'mid'));
  });
  peer.on('error', e => { log('✗ Fehler: ' + e.type + ' – ' + e.message, 'bad'); sum(e.type === 'peer-unavailable' ? '✗ Kein Test-Raum mit diesem Code.' : '✗ Fehler: ' + e.type, 'bad'); });
  setTimeout(() => { if (!$('sum').textContent.startsWith('✅')) log('… nach 30 s noch keine Verbindung', 'mid'); }, 30000);
};
$('copyBtn').onclick = async () => { const t = $('log').innerText; try { await navigator.clipboard.writeText(t); $('copyBtn').textContent = 'kopiert ✓'; } catch(e){ prompt('Protokoll:', t); } };
if (Q.get('join')) $('joinCode').value = Q.get('join');
</script>
</body>
</html>
