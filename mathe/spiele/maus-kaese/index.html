<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Maus &amp; Käse – Koordinatensystem</title>
<style>
@font-face{font-family:"Shantell Sans";src:url(../../fonts/shantell-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Shantell Sans";src:url(../../fonts/shantell-sans-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--ink:#1e1e1e;--muted:#5f5f5f;--paper:#fbfaf5;--grid:#dbe7f3;--gold:#ffe066;--green:#8ce99a;--xc:#1864ab;--yc:#d9480f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:"Shantell Sans","Comic Sans MS",cursive;font-size:17px;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;-webkit-text-size-adjust:100%}
body.m-beamer{font-size:clamp(19px,1.5vw,32px)}
body.m-phone{font-size:16px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.xc{color:var(--xc)}.yc{color:var(--yc)}
.mi{font-family:Arial,Helvetica,sans-serif;font-weight:700;display:inline-block;transform:scaleX(1.25);margin:0 .06em}
.sk{border:2.5px solid var(--ink);border-radius:14px 6px 16px 6px/6px 16px 6px 14px;background:#fff}
button{cursor:pointer;font:inherit;font-size:1.1em;border:2.5px solid var(--ink);border-radius:14px 6px 16px 6px/6px 16px 6px 14px;background:#fff;padding:.3em .8em;box-shadow:2px 2px 0 var(--ink);color:var(--ink);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:translate(2px,2px);box-shadow:none}
button[disabled]{opacity:.4;cursor:default}
button.go{background:var(--green)}button.gold{background:var(--gold)}
button.chip{font-size:.95em;padding:.15em .65em;box-shadow:1px 1px 0 var(--ink)}
button.chip.on{background:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0 9px}
label.l{display:block;font-size:.92em;color:var(--muted);margin-top:8px}
.wrap{min-height:100dvh;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{width:min(44em,100%);padding:.8em 1.1em}
.card h1{margin:0;font-size:2em;text-align:center;line-height:1.1}

/* ---------- Start ---------- */
#home .card{width:min(30em,100%);text-align:center}
.choices{display:grid;gap:.7em;margin:.9em 0 .6em}
.choices button{display:flex;flex-direction:column;align-items:center;padding:.5em .8em;line-height:1.15}
.choices button b{font-size:1.25em}
.choices button small{font-size:.8em;color:#2b4a30}
.choices .ic{font-size:1.8em;line-height:1}
.homelinks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ver{font-size:.8em;margin-top:.7em}

/* ---------- Einstellungen / Lobby / Beitreten ---------- */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:0 1.4em}
@media (max-width:760px){.opts{grid-template-columns:1fr}}
.prow{display:flex;gap:8px;align-items:center;margin:5px 0}
.prow .em{font-size:1.6em;padding:0 .4em}
.prow input,.inp1{flex:1;min-width:0;font:inherit;font-size:1.1em;padding:.25em .6em;border:2px solid var(--ink);border-radius:10px 4px 12px 4px;background:#fff}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:.9em}
.lob{width:min(70em,100%);display:grid;grid-template-columns:minmax(14em,20em) 1fr;gap:1em;align-items:start}
@media (max-width:760px){.lob{grid-template-columns:1fr}}
.joinbox{text-align:center;padding:.7em}
.joinbox .code{font-weight:700;font-size:3em;letter-spacing:.12em;line-height:1.1}
.joinbox .qr svg{width:min(11em,60vw);height:auto;margin:.3em auto;background:#fff;padding:4px;border-radius:6px;display:block}
.joinbox .url{font-size:.75em;word-break:break-all}
.setbox{padding:.7em 1em}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin:.3em 0 .4em;min-height:2.2em}
.pchip{display:inline-flex;align-items:center;gap:.3em;padding:.05em .7em .05em .35em;font-size:1em;border:2px solid var(--ink);border-radius:999px 14px 999px 14px;background:#fff}
.pchip .e{font-size:1.4em}.pchip.off{opacity:.4}.pchip.ok{background:#b2f2bb}
.waitbox{text-align:center;padding:1.2em 1.4em;max-width:90vw}
.waitbox .e{font-size:4em;line-height:1}
#netInfo{position:fixed;left:0;right:0;top:0;z-index:90;background:#fff3bf;border-bottom:2px solid var(--ink);padding:.25em .6em;text-align:center;font-size:.9em}

/* ---------- Spiel ---------- */
#gameWrap{min-height:100dvh;padding:8px}
#game{max-width:1900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(17em,23em);gap:12px;align-items:start}
.boardbox{display:flex;justify-content:center}
.bsvg{display:block;height:auto;background:rgba(255,255,255,.7);border-radius:10px;user-select:none;-webkit-user-select:none}
#board{width:min(100%,calc(100dvh - 18px))}
.side{display:flex;flex-direction:column;gap:.55em}
.head,.inp,.evl{padding:.5em .65em;display:flex;flex-direction:column;gap:.45em}
.topline{display:flex;align-items:center;gap:6px}
.topline .sp{flex:1}
.topline .ri{font-weight:700;white-space:nowrap}
.task{text-align:center}
.task .q{font-size:1.2em;font-weight:700;line-height:1.15}
.task .who{font-size:1em;color:var(--muted)}
.tbar{position:relative;height:1.7em;border:2px solid var(--ink);border-radius:10px 4px 10px 4px;background:#fff;overflow:hidden;margin-top:.3em}
.tfill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--gold);transition:width .12s linear}
.tbar span{position:relative;display:block;text-align:center;line-height:1.55em;font-size:.95em;font-weight:700}
.tbar.low .tfill{background:#e9ecef}
.fieldrow{display:flex;align-items:flex-start;justify-content:center;gap:.2em}
.par,.bar{font-size:3em;line-height:1.05;font-weight:400;margin-top:.5em;color:var(--ink)}
.bar{margin-top:.45em}
.fld{flex:1;min-width:0;max-width:9em;text-align:center;cursor:pointer}
.fh{font-weight:700;font-size:1.15em;line-height:1.1}
.fh small{font-weight:400;font-size:.75em;color:var(--muted);margin-left:.2em}
.fld.x .fh b{color:var(--xc)}.fld.y .fh b{color:var(--yc)}
.fv{display:flex;align-items:center;justify-content:center;gap:.1em;height:2.1em;margin-top:.15em;border:3px solid var(--ink);border-radius:12px 5px 14px 5px/5px 14px 5px 12px;background:#fff;font-size:1.8em;line-height:1}
.fld.x .fv{border-color:var(--xc)}.fld.y .fv{border-color:var(--yc)}
.fld.act .fv{background:#fff3bf;box-shadow:0 0 0 3px #ffe066,2px 2px 0 3px var(--ink)}
.fv .sg{font-size:.9em;padding:0 .18em;border:none;box-shadow:none;background:transparent;min-width:.9em}
.fv .dg{min-width:.9em;display:inline-block;text-align:left}
.fv .dg.empty::after{content:"?";color:#bbb}
.fld.act .fv .dg.empty::after{content:"_";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.echo{min-height:1.5em;font-size:.85em;line-height:1.2;margin-top:.2em}
.fld.x .echo b{color:var(--xc)}.fld.y .echo b{color:var(--yc)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.35em}
.pad button{font-size:1.35em;padding:.1em 0;height:1.9em}
.pad .okb{grid-column:2/5;background:var(--green);font-size:1.2em}
.pad .sgn{background:var(--gold)}
.pad .del{background:#ffe3e3}
.evl .res{width:100%;border-collapse:collapse;font-size:1em}
.evl .res th{font-size:.8em;color:var(--muted);font-weight:400;text-align:center;padding:0 .2em}
.evl .res td{padding:.25em .25em;border-bottom:1px solid #e5e5e5;vertical-align:middle}
.evl .res td.c{text-align:center;font-size:1.15em;white-space:nowrap}
.evl .res td.n{text-align:right;font-weight:700;font-size:1.2em;white-space:nowrap}
.evl .res tr{animation:pop .4s cubic-bezier(.2,1.8,.4,1) both}
.evl .badge{font-size:.8em;color:var(--muted);line-height:1.2}
.ok{color:#2b8a3e;font-weight:700}.no{color:#c92a2a;font-weight:700}
.msg{font-size:1.05em;line-height:1.3;text-align:center}
.msg .big{font-size:1.2em;font-weight:700;display:block}
.rankline{text-align:center;font-weight:700;font-size:1.05em}
.sumline{font-size:.95em;line-height:1.35}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:80;font-weight:700;font-size:1.9em;padding:.1em .7em;background:#fff;border:3px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:4px 4px 0 var(--ink);animation:toast 1.5s both;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{transform:translateX(-50%) scale(.3);opacity:0}15%{transform:translateX(-50%) scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.drawin{stroke-dasharray:4000;stroke-dashoffset:4000;animation:drawin 1s ease-out forwards}
@keyframes drawin{to{stroke-dashoffset:0}}
.fadein{animation:fadein .5s both}@keyframes fadein{from{opacity:0}}
#hostBar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;justify-content:center;align-items:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:#2b2140}
#hostBar span{color:#fff}#hostBar button{flex:1;max-width:300px;padding:.2em}
body.hb #gameWrap{padding-bottom:4em}

@media (orientation:portrait),(max-width:760px){
  #gameWrap{padding:4px 4px 10px}
  #game{grid-template-columns:1fr;max-width:640px;gap:6px}
  .side{display:contents}
  .head{order:1;padding:.35em .6em;gap:.25em}
  .boardbox{order:2}
  .inp,.evl{order:3;padding:.4em .6em;gap:.35em}
  #board{width:min(100%,calc(100dvh - 22em))}
  body.m-beamer #board{width:100%}
  .task .q{font-size:1.1em}
  .tbar{margin-top:.2em}
  .fv{height:2em;font-size:1.6em}
  .par,.bar{font-size:2.6em}
  .echo{font-size:.8em;min-height:1.3em}
  .pad{gap:.3em}
  .pad button{height:1.65em;font-size:1.3em}
}
@media (max-height:700px) and (max-width:760px){
  #board{width:min(100%,calc(100dvh - 20em))}
  .pad button{height:1.5em}
  .fv{height:1.85em}
}

/* ---------- Abdecken ---------- */
#cover{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
#cover .sk{padding:1.2em 1.6em;text-align:center;max-width:90vw}
#cover .e{font-size:4.5em;line-height:1}

/* ---------- Endstand ---------- */
#final .card{text-align:center;width:min(46em,100%)}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:12px 0}
.pod>div{display:flex;flex-direction:column;align-items:center}
.pod .e{font-size:2.4em}.pod .blk{width:5em;border:2.5px solid var(--ink);border-radius:8px 3px 9px 3px;display:grid;place-items:center;font-size:1.4em}
.ft{width:100%;border-collapse:collapse;font-size:.95em;margin-top:.4em}
.ft th{font-size:.78em;color:var(--muted);font-weight:400}
.ft td,.ft th{padding:.25em .25em;border-bottom:1px solid #e5e5e5;text-align:center}
.ft td:first-child,.ft th:first-child{text-align:left}
.ft td.n{font-weight:700;font-size:1.15em}
.ft tr.me td{background:#fff3bf}
.tip{margin-top:.6em;padding:.4em .7em;background:#fff9db;border:2px dashed var(--ink);border-radius:10px;font-size:.95em;text-align:left;line-height:1.3}

/* ---------- Erklärung: ganz langsam, Schritt für Schritt ---------- */
#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;padding:.4em .6em;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.itop{width:100%;display:flex;justify-content:flex-end}
#iCap{font-size:2.2em;font-weight:700;text-align:center;line-height:1.15;min-height:1.3em;padding:0 .3em}
.ibox{flex:1;display:flex;justify-content:center;align-items:center;min-height:0;width:100%}
#introSvg{width:min(100%,calc(100dvh - 10.5em))}
.inav{width:min(60em,100%);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:.3em}
.inav button{font-size:1.15em}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dots i{width:.7em;height:.7em;border:2px solid var(--ink);border-radius:50%;background:#fff;display:block}
.dots i.on{background:var(--gold);transform:scale(1.3)}
@media (orientation:portrait),(max-width:760px){
  #iCap{font-size:1.5em}
  #introSvg{width:min(100%,calc(100dvh - 12em))}
}
</style>
</head>
<body class="m-beamer">
<div id="netInfo" class="hidden"></div>

<!-- ============ Start: Spielart ============ -->
<section id="home" class="wrap">
  <div class="card sk">
    <h1>🐭 Maus &amp; Käse 🧀</h1>
    <div class="choices">
      <button class="go" id="mA"><span class="ic">📺</span><b>Nur Beamer</b><small>ein Gerät – alle nacheinander</small></button>
      <button class="go" id="mB"><span class="ic">📺 + 📱</span><b>Beamer + Handys</b><small>Beamer zeigt – Handys antworten</small></button>
      <button class="go" id="mC"><span class="ic">📱</span><b>Nur Handys</b><small>kein Beamer – ein Handy erstellt den Raum</small></button>
    </div>
    <div class="homelinks"><button class="chip" id="hJoin">🔑 Mitspielen mit Code</button><button class="chip" id="hIntro">❓ Erklärung</button><button class="chip" id="hFs">⛶ Vollbild</button></div>
    <div class="muted ver">Prototyp · Version <span id="verTxt"></span></div>
  </div>
</section>

<!-- ============ Einstellungen: Nur Beamer ============ -->
<section id="setup" class="wrap hidden">
  <div class="card sk">
    <h1>📺 Nur Beamer</h1>
    <label class="l">Wer spielt? (nacheinander)</label>
    <div id="plist"></div>
    <button class="chip" id="addP">＋ Spieler</button>
    <div class="opts">
      <div><label class="l">Zahlenraum</label><div class="row" id="optLevel"></div></div>
      <div><label class="l">Runden</label><div class="row" id="optRounds"></div></div>
      <div><label class="l">Hilfe</label><div class="row" id="optHelp"></div></div>
      <div><label class="l">Erklärung vorab</label><div class="row" id="optIntro"></div></div>
    </div>
    <div class="btnrow"><button id="backA">◀ zurück</button><button class="go" id="startA" style="font-size:1.35em;padding:.2em 1.1em">▶ Los geht's</button></div>
  </div>
</section>

<!-- ============ Lobby: Beamer + Handys / Nur Handys (Raum) ============ -->
<section id="hLobby" class="wrap hidden">
  <div class="lob">
    <div class="joinbox sk">
      <div class="muted" style="font-size:.85em">Handy: Seite öffnen, Code eingeben</div>
      <div class="code" id="hCode">····</div>
      <div class="qr" id="hQr"></div>
      <div class="url muted" id="hUrl"></div>
      <div class="muted" id="hNet" style="font-size:.85em;margin-top:.3em">Verbinde …</div>
      <button class="chip hidden" id="lShare" style="margin-top:.4em">📤 Link teilen</button>
    </div>
    <div class="setbox sk">
      <div>Dabei: <b id="hCount">0</b></div>
      <div class="plist" id="hList"></div>
      <div class="opts">
        <div><label class="l">Zahlenraum</label><div class="row" id="lLevel"></div></div>
        <div><label class="l">Runden</label><div class="row" id="lRounds"></div></div>
        <div><label class="l">Zeit pro Runde</label><div class="row" id="lTime"></div></div>
        <div><label class="l">Nach der Auflösung</label><div class="row" id="lAuto"></div></div>
        <div><label class="l">Hilfe</label><div class="row" id="lHelp"></div></div>
        <div><label class="l">Erklärung vorab</label><div class="row" id="lIntro"></div></div>
        <div><label class="l">Test-Bots 🧪</label><div class="row" id="lBots"></div></div>
      </div>
      <div class="btnrow"><button id="lBack">◀ zurück</button><button id="lFs" class="chip">⛶</button><button class="go" id="lStart" style="font-size:1.35em;padding:.2em 1.1em" disabled>▶ Los geht's</button></div>
    </div>
  </div>
</section>

<!-- ============ Handy: Beitreten ============ -->
<section id="join" class="wrap hidden">
  <div class="card sk" style="width:min(26em,100%)">
    <h1 id="jTitle">🔑 Mitspielen</h1>
    <label class="l" id="jCodeL">Code</label>
    <input class="inp1" id="jCode" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" style="width:100%;text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:1.6em">
    <label class="l">Dein Name</label>
    <div class="prow"><button class="em" id="jEmoji">🦊</button><input id="jName" maxlength="14" placeholder="Name" autocomplete="off"></div>
    <div class="muted" id="jMsg" style="min-height:1.4em;text-align:center"></div>
    <div class="btnrow" style="margin-top:.3em"><button id="jBack">◀</button><button class="go" id="jBtn" style="font-size:1.3em;padding:.2em 1.1em">Los ▶</button></div>
  </div>
</section>

<!-- ============ Handy: Warten ============ -->
<section id="wait" class="wrap hidden">
  <div class="sk waitbox"><div class="e" id="wE">🦊</div><div style="font-size:1.6em;font-weight:700" id="wN"></div><div style="margin-top:.4em;font-size:1.15em" id="wT"></div>
    <div class="btnrow"><button class="chip" id="wHelp">❓ Erklärung</button></div></div>
</section>

<!-- ============ Spiel ============ -->
<section id="gameWrap" class="hidden">
  <div id="game">
    <div class="boardbox"><svg id="board" class="bsvg"></svg></div>
    <div class="side">
      <div class="head sk">
        <div class="topline">
          <span class="ri" id="roundInfo">Runde 1 / 10</span><span class="ri muted" id="clock"></span><span class="sp"></span><span class="ri" id="scoreInfo">⭐ 0</span>
          <button class="chip" id="helpBtn" title="Erklärung">❓</button><button class="chip" id="modeBtn" title="Beamer / Handy">📺</button><button class="chip" id="quitBtn" title="Beenden">✕</button>
        </div>
        <div class="task">
          <div class="who" id="who"></div>
          <div class="q">Wo liegt der Käse 🧀?</div>
          <div class="tbar" id="tbar"><div class="tfill" id="tfill"></div><span id="tval">⚡ +20</span></div>
        </div>
      </div>
      <div class="inp sk" id="inUi">
        <div class="fieldrow">
          <span class="par">(</span>
          <div class="fld x act" id="fx" data-f="x"><div class="fh"><b>x</b><small>←→</small></div><div class="fv"><button class="sg" id="sx" tabindex="-1">+</button><span class="dg empty" id="dx"></span></div><div class="echo" id="ex"></div></div>
          <span class="bar">|</span>
          <div class="fld y" id="fy" data-f="y"><div class="fh"><b>y</b><small>↑↓</small></div><div class="fv"><button class="sg" id="sy" tabindex="-1">+</button><span class="dg empty" id="dy"></span></div><div class="echo" id="ey"></div></div>
          <span class="par">)</span>
        </div>
        <div class="pad" id="pad"></div>
      </div>
      <div class="evl sk hidden" id="evUi">
        <div class="msg" id="evMsg"></div>
        <div class="rankline" id="evRank"></div>
        <table class="res" id="resT"></table>
        <div style="text-align:center"><button class="gold" id="nextBtn" style="font-size:1.2em">Nächste Runde ▶</button></div>
      </div>
      <div class="evl sk hidden" id="hostUi">
        <div class="sumline" id="hostInfo"></div>
        <div class="plist" id="hostChips"></div>
        <div style="text-align:center"><button class="gold" id="hostBtn" style="font-size:1.2em">▶ Auflösen</button></div>
      </div>
    </div>
  </div>
  <div id="hostBar" class="hidden"><span>👑</span><button class="gold" id="hbNext">⏩ Weiter</button><button id="hbEnd">🏁</button></div>
</section>

<div id="cover" class="hidden"><div class="sk"><div class="e" id="coverE"></div><div style="font-size:2em;font-weight:700" id="coverN"></div>
  <div style="font-size:1.1em;margin:6px 0 14px">ist dran – die anderen schauen weg 🙈</div><button class="go" id="coverBtn" style="font-size:1.4em">Ich bin bereit ▶</button></div></div>

<section id="final" class="wrap hidden">
  <div class="card sk"><div style="font-size:2.1em;font-weight:700">🏆 Endstand</div><div class="pod" id="pod"></div><div id="finalT"></div><div id="finalTip"></div>

<script>
(() => {
const APP_VERSION = '2026-11-19b';

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const lin = (v, full, zero) => clamp((zero - v) / (zero - full), 0, 1);
const easeIO = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const mfix = h => String(h).replace(/−/g, '<span class="mi">−</span>');         // klares Minus

const Q = new URLSearchParams(location.search);

/* ---------- Töne ---------- */
let AC = null;

function tone(f, d = .15, type = 'sine', v = .12, w = 0){ const c = ac(); if (!c) return; const t = c.currentTime + w, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .03); }
const sKey = () => tone(1100, .03, 'square', .035);
const sStep = () => tone(760 + Math.random() * 120, .05, 'triangle', .08);

/* ---------- Zahlenräume (immer 1, 2, 3 … – jede Zahl beschriftet) ---------- */

const EMOJIS = ['🦊','🐼','🐸','🦄','🐯','🐨','🐙','🦉','🐢','🐝','🦁','🐵','🚀','⚽','🌵','🍕','🎸','🦖','🐱','🐶','🦋','🐬','🍩','🎮'];

/* ================= Koordinatensystem (Brett) =================
   Quadratisch −lim … lim, Raster immer in Einerschritten. Maus wohnt im Nullpunkt (Mausloch). */
function Board(svg){
  const B = {svg, lim:5, o:{lim:5}, U:50, PAD:1.3, k:1, px:16};
  const bg = el('g', {}, svg), dyn = el('g', {}, svg); B.dyn = dyn;
  B.X = x => (x + B.lim + B.PAD) * B.U; B.Y = y => (B.lim - y + B.PAD) * B.U;
  B.fs = n => n * B.k; B.sw = n => n * B.k;
  B.esz = () => Math.max(B.U * .9, B.fs(22));
  B.draw = o => {
    Object.assign(B.o, o); const lim = B.o.lim; B.lim = lim;
    const W = (2 * lim + 2 * B.PAD) * B.U; B.W = W; svg.setAttribute('viewBox', `0 0 ${W} ${W}`);
    const cw = svg.getBoundingClientRect().width || 600; B.k = W / cw;
    const px = B.o.px || (document.body.classList.contains('m-beamer') ? 21 : 15), fs = B.fs, sw = B.sw, X = B.X, Y = B.Y; B.px = px;
    bg.innerHTML = ''; const rc = rough.svg(svg); let seed = 11;
    const ro = (w, c) => ({roughness:.5, bowing:.5, stroke:c || '#1e1e1e', strokeWidth:sw(w), seed:seed++});
    const tx = (x, y, t, c, size, anchor, halo) => { const e = el('text', {x, y, 'font-family':'Shantell Sans, Comic Sans MS, cursive', 'font-size':fs(size), fill:c, 'text-anchor':anchor || 'middle', 'font-weight':700}, bg);
      if (halo){ e.setAttribute('paint-order', 'stroke'); e.setAttribute('stroke', '#fff'); e.setAttribute('stroke-width', fs(4)); e.setAttribute('stroke-linejoin', 'round'); } setT(e, t); return e; };
    const XC = '#1864ab', YC = '#d9480f';
    for (let v = -lim; v <= lim; v++){
      el('line', {x1:X(v), y1:Y(-lim), x2:X(v), y2:Y(lim), stroke:'#a5c8ea', 'stroke-width':sw(1.3)}, bg);
      el('line', {x1:X(-lim), y1:Y(v), x2:X(lim), y2:Y(v), stroke:'#a5c8ea', 'stroke-width':sw(1.3)}, bg);
    }
    const tip = B.U * .7;
    bg.appendChild(rc.line(X(-lim) - B.U * .45, Y(0), X(lim) + tip, Y(0), ro(3, XC)));
    bg.appendChild(rc.line(X(0), Y(-lim) + B.U * .45, X(0), Y(lim) - tip, ro(3, YC)));
    bg.appendChild(rc.linearPath([[X(lim) + tip - sw(11), Y(0) - sw(8)], [X(lim) + tip, Y(0)], [X(lim) + tip - sw(11), Y(0) + sw(8)]], ro(3, XC)));
    bg.appendChild(rc.linearPath([[X(0) - sw(8), Y(lim) - tip + sw(11)], [X(0), Y(lim) - tip], [X(0) + sw(8), Y(lim) - tip + sw(11)]], ro(3, YC)));
    for (let v = -lim; v <= lim; v++){
      if (v === 0) continue;
      bg.appendChild(rc.line(X(v), Y(0) - sw(5), X(v), Y(0) + sw(5), ro(1.8, XC)));
      bg.appendChild(rc.line(X(0) - sw(5), Y(v), X(0) + sw(5), Y(v), ro(1.8, YC)));
      tx(X(v), Y(0) + sw(8) + fs(px * .95), (v < 0 ? '−' : '') + Math.abs(v), XC, px, 'middle', true);
      tx(X(0) - sw(10), Y(v) + fs(px * .34), (v < 0 ? '−' : '') + Math.abs(v), YC, px, 'end', true);
    }
    bg.appendChild(rc.ellipse(X(0), Y(0), B.U * .8, B.U * .48, {fill:'#3b3b3b', fillStyle:'solid', stroke:'#1e1e1e', strokeWidth:sw(2), roughness:.6, seed:3}));
    tx(X(0) + sw(10), Y(0) + fs(px + 12), '0', '#333', px, 'start', true);
    tx(X(lim) + B.U * 1.0, Y(0) + fs(px * .4), 'x', XC, px + 6);
    tx(X(0), Y(lim) - B.U * .85, 'y', YC, px + 6);
    if (B.o.names !== false){            // knappe Zeichen: links/rechts, oben/unten
      const p2 = px * .72;
      tx(X(-lim) + sw(6), Y(0) - sw(9), '← links −', XC, p2, 'start', true);
      tx(X(lim) - sw(6), Y(0) - sw(9), '+ rechts →', XC, p2, 'end', true);
      tx(X(0) + sw(13), Y(lim) + fs(p2 * .95), '↑ oben +', YC, p2, 'start', true);
      tx(X(0) + sw(13), Y(-lim) - sw(6), '↓ unten −', YC, p2, 'start', true);
    }
  };
  return B;
}
function mkEmoji(B, parent, ch, x, y, o = {}){
  const g = el('g', {transform:`translate(${B.X(x)},${B.Y(y)})`}, parent), s = o.size || B.esz();
  if (o.ring){ el('circle', {r:s * .62, fill:'#fff', 'fill-opacity':.75, stroke:o.ring, 'stroke-width':B.sw(3.5)}, g); }
  const t = el('text', {'text-anchor':'middle', 'dominant-baseline':'central', 'font-size':s, y:s * .04}, g); t.textContent = ch;
  if (o.dot){ el('circle', {r:B.sw(3.4), fill:'#1e1e1e', stroke:'#fff', 'stroke-width':B.sw(1.4)}, g); }
  g.place = (x2, y2, sc = 1, dx = 0, dy = 0) => g.setAttribute('transform', `translate(${B.X(x2) + dx},${B.Y(y2) + dy}) scale(${sc})`);
  return g;
}
function tag(B, parent, x, y, text, color, px, anchor, dx = 0, dy = 0){
  const e = el('text', {x:B.X(x) + dx, y:B.Y(y) + dy, 'font-family':'Shantell Sans, Comic Sans MS, cursive', 'font-size':B.fs(px), fill:color, 'text-anchor':anchor || 'middle', 'font-weight':700,
    'paint-order':'stroke', stroke:'#fff', 'stroke-width':B.fs(5), 'stroke-linejoin':'round'}, parent); setT(e, text); return e;
}
function burst(B, parent, x, y){
  const items = [...'✨⭐✨🌟⭐✨✨⭐'].map((ch, i) => { const t = el('text', {'text-anchor':'middle', 'dominant-baseline':'central', 'font-size':B.fs(22)}, parent); t.textContent = ch; return {t, a:i / 8 * Math.PI * 2}; });
  return tween(900, e => items.forEach(it => { const r = e * B.U * 1.6; it.t.setAttribute('x', B.X(x) + Math.cos(it.a) * r); it.t.setAttribute('y', B.Y(y) + Math.sin(it.a) * r); it.t.setAttribute('opacity', 1 - e * e); }), u => u).then(() => items.forEach(it => it.t.remove()));
}

/* ---------- Aufgaben & Wertung ---------- */
const quad = (x, y) => (x < 0 ? 'L' : x > 0 ? 'R' : 'A') + (y < 0 ? 'U' : y > 0 ? 'O' : 'A');
function makeTask(level, mem){
  const c = CFG[level], vals = []; for (let v = -c.lim; v <= c.lim; v++) vals.push(v);
  mem.lastQ = mem.lastQ || [];
  for (let tries = 0; tries < 800; tries++){
    const x = rnd(vals), y = rnd(vals);
    if (Math.random() < .88 && x >= 0 && y >= 0) continue;                       // meist ins Minus
    if (Math.abs(x) + Math.abs(y) < c.min) continue;
    if ((x === 0 || y === 0) && Math.random() > .13) continue;                   // Achsenpunkte seltener
    const q = quad(x, y); if (mem.lastQ.length >= 2 && mem.lastQ.every(z => z === q)) continue;
    if (mem.last && mem.last.x === x && mem.last.y === y) continue;
    mem.lastQ.push(q); if (mem.lastQ.length > 2) mem.lastQ.shift(); mem.last = {x, y}; return {x, y};
  }
  return {x:-2, y:-1};
}
function classify(a, b, x, y){
  if (a === null || b === null) return 'none';
  const xo = a === x, yo = b === y; if (xo && yo) return 'ok';
  if (a === y && b === x) return 'swap';
  if (!xo && x !== 0 && a === -x && yo) return 'sx';
  if (!yo && y !== 0 && b === -y && xo) return 'sy';
  if (!xo && !yo && x !== 0 && y !== 0 && a === -x && b === -y) return 'sb';
  return xo ? 'y' : yo ? 'x' : 'both';
}
function scoreAnswer(T, a, b, t){
  const xo = a === T.x, yo = b === T.y, px = xo ? 40 : 0, py = yo ? 40 : 0, pt = xo && yo ? Math.round(20 * lin(t, 4, 16)) : 0;
  return {xo, yo, px, py, pt, pts:px + py + pt, err:classify(a, b, T.x, T.y), t};
}
const NONE_R = t => ({xo:false, yo:false, px:0, py:0, pt:0, pts:0, err:'none', t});
const ERR_SHORT = {swap:'x und y vertauscht', sx:'Vorzeichen bei x', sy:'Vorzeichen bei y', sb:'beide Vorzeichen', x:'x falsch', y:'y falsch', both:'x und y falsch', none:'keine Antwort'};
const stepX = x => x === 0 ? 'gar nicht nach links/rechts' : `${Math.abs(x)} nach ${x < 0 ? 'links ←' : 'rechts →'}`;
const stepY = y => y === 0 ? 'gar nicht nach oben/unten' : `${Math.abs(y)} nach ${y < 0 ? 'unten ↓' : 'oben ↑'}`;
const newStats = () => ({x:0, y:0, full:0, n:0, tsum:0, swap:0, sx:0, sy:0});
function addStats(st, r){ st.n++; if (r.xo) st.x++; if (r.yo) st.y++; if (r.xo && r.yo){ st.full++; st.tsum += r.t; } if (r.err === 'swap') st.swap++; if (r.err === 'sx') st.sx++; if (r.err === 'sy') st.sy++; if (r.err === 'sb'){ st.sx++; st.sy++; } }
function feedback(r, T){
  const sol = `Richtig: <b>${coord(T.x, T.y)}</b> → <span class="xc">${mfix(stepX(T.x))}</span>, dann <span class="yc">${mfix(stepY(T.y))}</span>.`;
  if (r.err === 'ok') return `<span class="big">${rnd(['🧀 Käse gefangen!', '🧀 Mmh, lecker!', '🧀 Treffer!', '🧀 Volltreffer!'])}</span>${r.pt >= 16 ? '⚡ Blitzschnell!' : r.pt >= 8 ? 'Schön flott.' : 'Richtig – nächstes Mal schneller?'}`;
  if (r.err === 'none') return `<span class="big">Keine Antwort</span>${sol}`;
  const m = {
    swap: `<b>x und y vertauscht.</b> Erst x (←→), dann y (↑↓).`,
    sx: `<b>Vorzeichen bei x:</b> Der Käse liegt ${T.x < 0 ? 'links → Minus (−)' : 'rechts → Plus (+)'}.`,
    sy: `<b>Vorzeichen bei y:</b> Der Käse liegt ${T.y < 0 ? 'unten → Minus (−)' : 'oben → Plus (+)'}.`,
    sb: `<b>Beide Vorzeichen verdreht:</b> ${T.x < 0 ? 'links (−)' : 'rechts (+)'} und ${T.y < 0 ? 'unten (−)' : 'oben (+)'}.`,
    x: `<b>x stimmt nicht</b> – y war richtig.`, y: `<b>y stimmt nicht</b> – x war richtig.`, both: `<b>Leider kein Käse.</b>`
  }[r.err];
  return `<span class="big">${r.xo ? 'x ✓' : 'x ✗'} · ${r.yo ? 'y ✓' : 'y ✗'}</span>${m}<br>${sol}`;
}

/* ================= Eingabe (Felder + Ziffernblock) ================= */
let F = {x:{s:'+', d:''}, y:{s:'+', d:''}, act:'x'};
const fval = f => f.d === '' ? null : (f.s === '-' && +f.d !== 0 ? -1 : 1) * +f.d;
function echoText(axis, v){
  if (v === null) return '';
  if (axis === 'x') return v === 0 ? 'in der Mitte' : v < 0 ? `<b>${-v}</b> nach links ←` : `<b>${v}</b> nach rechts →`;
  return v === 0 ? 'in der Mitte' : v < 0 ? `<b>${-v}</b> nach unten ↓` : `<b>${v}</b> nach oben ↑`;
}
function renderFields(){
  ['x', 'y'].forEach(a => {
    const f = F[a], v = fval(f);
    $('f' + a).classList.toggle('act', F.act === a);
    $('s' + a).innerHTML = f.s === '-' ? '<span class="mi">−</span>' : '+';
    const dg = $('d' + a); dg.textContent = f.d; dg.classList.toggle('empty', f.d === '');
    $('e' + a).innerHTML = S.help === '0' ? '' : mfix(echoText(a, v));
  });
  const ok = F.x.d !== '' && F.y.d !== '';
  const okb = document.querySelector('#pad .okb'); if (okb) okb.textContent = ok ? '🐭 Los!' : '▶ weiter';
  renderGhost();
  if (S.role === 'player' && ok && S.phase === 'input') netSend({t:'draft', x:fval(F.x), y:fval(F.y)});
}
let GH = null;
function renderGhost(){
  if (GH){ GH.remove(); GH = null; }
  if (S.help !== '2' || S.phase !== 'input') return;
  const a = fval(F.x), b = fval(F.y); if (a === null || b === null) return;
  if (Math.abs(a) > BD.lim || Math.abs(b) > BD.lim) return;
  GH = el('g', {opacity:.85}, BD.dyn); el('circle', {cx:BD.X(a), cy:BD.Y(b), r:BD.sw(11), fill:'none', stroke:'#7048e8', 'stroke-width':BD.sw(3.2), 'stroke-dasharray':`${BD.sw(5)} ${BD.sw(4)}`}, GH);
}
function press(k){
  if (S.phase !== 'input') return;
  const f = F[F.act];
  if (/^\d$/.test(k)){ if (f.d.length < 2){ f.d = f.d === '0' ? k : f.d + k; } sKey(); }
  else if (k === '-'){ f.s = '-'; sKey(); }
  else if (k === '+'){ f.s = '+'; sKey(); }
  else if (k === 'del'){ if (f.d) f.d = f.d.slice(0, -1); else f.s = '+'; sKey(); }
  else if (k === 'sw'){ F.act = F.act === 'x' ? 'y' : 'x'; }
  else if (k === 'ok'){
    if (F.x.d !== '' && F.y.d !== '') return submitAnswer();
    F.act = F.x.d === '' ? 'x' : F.y.d === '' ? 'y' : F.act; sKey();
  }
  renderFields();
}
function buildPad(){
  const keys = [['1', '1'], ['2', '2'], ['3', '3'], ['del', '⌫'], ['4', '4'], ['5', '5'], ['6', '6'], ['-', '<span class="mi">−</span>'], ['7', '7'], ['8', '8'], ['9', '9'], ['+', '+'], ['0', '0'], ['ok', '▶ weiter']];
  $('pad').innerHTML = keys.map(([k, l]) => `<button data-k="${k}" class="${k === 'ok' ? 'okb' : k === '-' || k === '+' ? 'sgn' : k === 'del' ? 'del' : ''}">${l}</button>`).join('');
  $('pad').onclick = e => { const b = e.target.closest('button'); if (b){ ac(); press(b.dataset.k); } };
}
['x', 'y'].forEach(a => {
  $('f' + a).onclick = e => { if (S.phase !== 'input') return; F.act = a; if (e.target.closest('.sg')){ F[a].s = F[a].s === '-' ? '+' : '-'; sKey(); } renderFields(); };
});
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (!$('intro').classList.contains('hidden')){
    if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); iNext(); } else if (e.key === 'ArrowLeft') iGo(II - 1); else if (e.key === 'Escape') iClose();
    return; }
  if (S.phase !== 'input' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (/^\d$/.test(k)) press(k);

function tipFor(st){
  const bits = [], errs = st.sx + st.sy;
  if (errs >= 2 && errs >= st.swap) bits.push('Vorzeichen üben: <b>Minus = links (x) / unten (y)</b>');
  if (st.swap >= 2) bits.push('x und y nicht vertauschen: <b>x zuerst (←→), dann y (↑↓)</b>');
  if (!bits.length && st.n && st.full === st.n) bits.push('alles richtig 🎉');
  return bits.join(' · ');
}

  $('roundInfo').textContent = `Runde ${m.n} / ${m.rounds}`; $('scoreInfo').textContent = '⭐ ' + (C.total || 0); $('who').innerHTML = '';

  resetInput(); S.phase = 'input'; S.t0 = performance.now() - (m.elapsed || 0) * 1000; startTimer(); renderFields();
}
function netSubmit(a, b){
  if (S.phase !== 'input') return;
  const t = (performance.now() - S.t0) / 1000; clearInterval(TM); S.phase = 'sent'; sDing(); if (GH){ GH.remove(); GH = null; }
  netSend({t:'submit', x:a, y:b});
  show('inUi', false); show('evUi'); show('nextBtn', false); $('resT').innerHTML = ''; $('evRank').textContent = '';
  $('evMsg').innerHTML = `<span class="big">✓ Abgegeben</span>${mfix(plain(coord(a, b)))} · ${t.toFixed(1).replace('.', ',')} s<br><span class="muted">Warte auf die anderen …</span>`;
}
async function pReveal(m){
  S.phase = 'reveal'; S.tok++; clearInterval(TM); S.task = m.task;
  const mine = m.res.find(r => r.pid === C.pid); if (mine) C.total = mine.total;
  if (S.screen !== 'gameWrap'){ setHostUi(false); go('gameWrap'); applyMode(); showRound(m.task, S.level); }
  show('inUi', false); show('evUi'); show('nextBtn', false); $('resT').innerHTML = ''; $('evRank').textContent = ''; $('evMsg').innerHTML = '🐭 …läuft los!';
  const ok = await animateReveal(mine ? [mine] : [], 'solo'); if (!ok) return;
  const r = mine ? mine.r : NONE_R(0), sorted = [...m.res].sort((a, b) => b.total - a.total), place = sorted.findIndex(x => x.pid === C.pid) + 1;
  $('evMsg').innerHTML = feedback(r, m.task);
  $('resT').innerHTML = mine ? resRows([mine], false) : '';
  $('evRank').innerHTML = mine ? `Platz ${place} von ${sorted.length} · ${mine.total} P` : '';
  $('scoreInfo').textContent = '⭐ ' + (C.total || 0);
  if (!(C.isCreator && H.room)) $('evMsg').innerHTML += `<br><span class="muted">${m.round >= m.rounds ? 'gleich kommt der Endstand …' : 'gleich geht es weiter …'}</span>`;
}
/* ---------- Nur Handys: Raum erstellen (Host läuft auf diesem Handy) ---------- */
let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (H.room && document.visibilityState === 'visible') keepAwake(); });
function createRoom(){
  const name = $('jName').value.trim(); if (!name){ $('jMsg').textContent = 'Bitte einen Namen eingeben.'; return; }
  C.name = name; saveMe(); ac(); $('jBtn').disabled = true; $('jMsg').textContent = 'Raum wird erstellt …';
  H.room = true; H.creatorPid = C.pid; S.role = 'player';
  H.onReady = () => {
    const hostSide = {open:true, send: m => setTimeout(() => pOnMsg(m), 0)};              // Host → Spieler (gleiches Gerät)
    C.conn = {open:true, send: m => setTimeout(() => hOnMsg(hostSide, m), 0)};              // Spieler → Host
    C.conn.send({t:'hello', pid:C.pid, name:C.name, avatar:C.emoji, v:APP_VERSION}); keepAwake(); pShowRoom();
  };
  lobbyChips(); hOpenPeer();
}
function pShowRoom(){ S.role = 'player'; go('hLobby'); show('lShare', true); show('hostBar', false); document.body.classList.remove('hb'); hRender(); }
$('lShare').onclick = async () => { const url = H.url; try { if (navigator.share){ await navigator.share({title:'Maus & Käse', text:'Spiel mit! Code: ' + H.code, url}); return; } } catch(e){ return; }
  try { await navigator.clipboard.writeText(url); toast('Link kopiert ✓'); } catch(e){ prompt('Link kopieren:', url); } };
$('hbNext').onclick = () => { if (H.room) hAdvance(); };
$('hbEnd').onclick = () => { if (H.room && H.phase !== 'end' && confirm('Spiel jetzt beenden?')) hEnd(); };

/* ================= Start ================= */
$('mA').onclick = () => { ac(); S.role = 'local'; go('setup'); renderSetup(); };
$('mB').onclick = () => { ac(); startBeamer(); };
$('mC').onclick = () => { ac(); startJoin('', true); };
$('hJoin').onclick = () => { ac(); startJoin('', false); };
$('backA').onclick = () => go('home'); $('lBack').onclick = () => location.replace(location.pathname);
$('startA').onclick = () => { ac(); startLocal(); };
$('lStart').onclick = () => { if (H.phase === 'lobby' && active().length) hStart(); };
$('quitBtn').onclick = () => { if (!confirm('Spiel beenden?')) return; if (S.role === 'local'){ S.tok++; clearInterval(TM); S.phase = 'setup'; go('setup'); renderSetup(); } else location.replace(location.pathname); };
$('modeBtn').onclick = () => { const cur = document.body.classList.contains('m-beamer') ? 'beamer' : 'phone'; S.mode = cur === 'beamer' ? 'phone' : 'beamer'; applyMode(); };
setupFs($('hFs')); setupFs($('lFs'));
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
if (typeof Peer === 'undefined'){ $('mB').disabled = true; $('mC').disabled = true; $('hJoin').disabled = true; }
BD = Board($('board')); buildPad(); applyMode(); go('home');
if (Q.get('debug')) window.__dbg = {S, H, C, makeTask, classify, press, fval, ISTEPS, iGo, hStart, hAdvance};
if (Q.get('join') !== null) startJoin(Q.get('join'), false);
else if (Q.get('host') !== null) startBeamer();
})();
</script>
