<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umfrage live – Wie nutzt du das Netz? (ITG 7.3)</title>
<style>
@font-face{font-family:"Shantell Sans";src:url(../internet-fuehrerschein/fonts/shantell-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Shantell Sans";src:url(../internet-fuehrerschein/fonts/shantell-sans-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--bg:#fbfaf5;--grid:#dbe7f3;--card:#fff;--ink:#1e1e1e;--muted:#6b6b6b;--gold:#ffe066;--btn:#fff;--soft:#e7f5ff;
  --c0:#1971c2;--c1:#f08c00;--c2:#2f9e44;--c3:#e03131;--c4:#9c36b5;--c5:#d6336c}
body.dark{--bg:#10131a;--grid:#1b2433;--card:#1a1f2b;--ink:#e9ecef;--muted:#9aa4b2;--btn:#232a38;--soft:#1c2a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:"Shantell Sans","Comic Sans MS",cursive;font-size:17px;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:.85rem}
.sk{border:2.5px solid var(--ink);border-radius:14px 6px 16px 6px/6px 16px 6px 14px;background:var(--card)}
button{cursor:pointer;font:inherit;font-size:1.05rem;border:2.5px solid var(--ink);border-radius:14px 6px 16px 6px/6px 16px 6px 14px;background:var(--btn);color:var(--ink);padding:7px 16px;box-shadow:3px 3px 0 var(--ink)}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.4;cursor:default}
button.go{background:#8ce99a;color:#1e1e1e}button.big{font-size:1.5rem;padding:12px 28px}button.ghost{box-shadow:none;padding:4px 10px}
input.code{font:inherit;font-size:2rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;width:7.5ch;padding:8px 12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:10px 16px 40px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0}
.top .ti{font-weight:700;font-size:1.2rem}.top .sp{flex:1}
.chip{border:2px solid var(--ink);border-radius:999px 14px 999px 14px;background:var(--card);padding:2px 12px;font-weight:700;white-space:nowrap}
.land{max-width:760px;margin:30px auto;padding:22px;text-align:center}
.land .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.land .opt{padding:16px}
@media(max-width:620px){.land .two{grid-template-columns:1fr}}
/* Host */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;margin-top:10px}
@media(max-width:820px){.lobby{grid-template-columns:1fr}}
.joinbox{padding:18px;text-align:center}
.bigcode{font-size:clamp(3rem,8vw,5.5rem);font-weight:700;letter-spacing:.2em;line-height:1}
.qr{width:min(260px,60vw);margin:8px auto;background:#fff;padding:6px;border-radius:8px}
.qr svg{width:100%;height:auto;display:block}
.who{padding:16px;min-height:200px}
.avs{display:flex;flex-wrap:wrap;gap:8px;font-size:2rem;margin-top:8px}
.av{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.av.off{opacity:.3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.qcard{padding:18px 24px;margin:10px 0;text-align:center}
.qno{color:var(--muted);font-size:1rem}
.qq{font-size:clamp(1.6rem,3.6vw,3rem);font-weight:700;line-height:1.25;margin:.2em 0}
.tiles{display:grid;gap:14px;margin:14px 0}
.tiles.n2{grid-template-columns:1fr 1fr}.tiles.n3,.tiles.n5,.tiles.n6{grid-template-columns:repeat(3,1fr)}.tiles.n4{grid-template-columns:1fr 1fr}
@media(max-width:640px){.tiles.n2,.tiles.n3,.tiles.n4,.tiles.n5,.tiles.n6{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:12px;text-align:left;font-weight:700;color:#fff;padding:18px 16px;min-height:86px;font-size:clamp(1.1rem,2.2vw,1.9rem);box-shadow:4px 4px 0 var(--ink)}
.tile .sh{font-size:2rem;line-height:1}
.c0{background:var(--c0)}.c1{background:var(--c1);color:#1e1e1e}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.tile.sel{box-shadow:0 0 0 5px #fff,0 0 0 8px var(--ink),4px 4px 0 var(--ink)}
.tile.dim{opacity:.35}
.prog{height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--c2);width:0;transition:width .3s}
.bars{display:grid;gap:10px;margin:14px 0}
.bar{display:grid;grid-template-columns:minmax(120px,28%) 1fr;gap:12px;align-items:center}
.bar .lb{font-weight:700;font-size:clamp(1rem,2vw,1.6rem);text-align:right}
.bar .tr{border:2.5px solid var(--ink);border-radius:10px;background:var(--card);height:56px;position:relative;overflow:hidden}
.bar .fill{height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;color:#fff;min-width:0}
.bar .fill.c1{color:#1e1e1e}
.bar .val{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:700;font-size:1.5rem}
.bar.top .tr{box-shadow:0 0 0 4px var(--gold)}
.info{padding:12px 18px;margin:12px 0;background:var(--soft);font-size:clamp(1.05rem,1.8vw,1.5rem)}
.sumrow{padding:10px 14px;margin:8px 0}
.sumrow .q{font-weight:700}
.stack{display:flex;height:30px;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-top:6px}
.stack i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#fff;font-size:.9rem;overflow:hidden}
.stack i.c1{color:#1e1e1e}
.legend{font-size:.9rem;margin-top:4px}
.dot{display:inline-block;width:.9em;height:.9em;border-radius:50%;border:2px solid var(--ink);vertical-align:-.1em;margin:0 3px 0 10px}
.dot:first-child{margin-left:0}
/* Client */
.cl{max-width:560px;margin:0 auto}
.cl .qq{font-size:1.35rem}
.cl .tile{font-size:1.2rem;min-height:70px}
.status{padding:16px;text-align:center;margin:14px 0}
.status .em{font-size:3.2rem}
@media print{
  body{background:#fff;color:#000}
  .noprint{display:none!important}
  .sk,.stack,.sumrow{box-shadow:none}
  .stack i{color:#000!important;background:#fff!important;border-right:2px solid #000}
}
</style>
</head>
<body>
<main id="app"></main>
<script src="peerjs.min.js"></script>
<script src="qrcode.js"></script>
<script src="../internet-fuehrerschein/inhalt.js"></script>
<script>
const D = window.ITG;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('app');
const Q = new URLSearchParams(location.search);

/* ---------- Netzwerk (gleiches Prinzip wie Schätzspiel-Live: PeerJS, kein eigener Server) ---------- */
const PEER_OPTS = Q.get('ph') ? {host: Q.get('ph'), port: +(Q.get('pp') || 9000), path: Q.get('ppath') || '/', secure: Q.get('ps') === '1'} : {};
PEER_OPTS.config = {iceServers: [
  {urls: 'stun:stun.relay.metered.ca:80'},
  {urls: 'stun:stun.l.google.com:19302'},
  {urls: 'turn:global.relay.metered.ca:80', username: 'a8c27e443d09af6572e14185', credential: 'lXvBAswWQlUTXAaL'},
  {urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: 'a8c27e443d09af6572e14185', credential: 'lXvBAswWQlUTXAaL'},
  {urls: 'turn:global.relay.metered.ca:443', username: 'a8c27e443d09af6572e14185', credential: 'lXvBAswWQlUTXAaL'},
  {urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: 'a8c27e443d09af6572e14185', credential: 'lXvBAswWQlUTXAaL'}
]};
const PREFIX = 'hvh-itgumfrage-';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const SHAPES = ['▲','◆','●','■','★','⬟'];
const EMOJIS = ['😀','😎','🤓','🥳','🤩','😜','🤠','🥸','😇','🤖','👻','👽','🐱','🐶','🦊','🐼','🐸','🦁','🐯','🐵','🐙','🦄','🐝','🐢','🦖','🐧','🦉','🐬','🦈','🍕','🍩','🍉','⚽','🏀','🎸','🚀'];
const emojiOf = pid => { let h = 0; for(const c of pid) h = (h*31 + c.charCodeAt(0)) >>> 0; return EMOJIS[h % EMOJIS.length]; };
const rnd = n => [...Array(n)].map(() => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');

/* ---------- Fragen: 2 Extra-Fragen + die 8 Ja/Nein-Fragen aus dem Führerschein ---------- */
const EXTRA = [
  { q: 'Wie viele Stunden am Tag bist du ungefähr am Handy, Tablet oder PC (Freizeit)?', opts: ['unter 1 Stunde','1 bis 3 Stunden','3 bis 5 Stunden','mehr als 5 Stunden'],
    info: 'Das ist keine Bewertung. Spannend ist: Wofür nutzt du die Zeit, und merkst du, wenn es zu viel wird?' },
  { q: 'Welche App oder Plattform nutzt du am meisten?', opts: ['WhatsApp','TikTok','YouTube','Instagram oder Snapchat','Spiele (z. B. Roblox, Fortnite)'],
    info: 'Jede dieser Plattformen sammelt Daten über dich. Dazu gleich mehr bei „Meine Daten“.' }
];
const QS = EXTRA.concat(D.nutzung.map(x => ({ q: x.q, opts: ['Ja','Nein'], info: x.info, yn: true })));
QS.forEach(q => { q.cols = q.yn ? [0,1] : q.opts.map((_,i) => i); });

function joinUrl(code){
  const u = new URL(location.href); const keep = new URLSearchParams();
  ['ph','pp','ps','ppath'].forEach(k => { if(Q.get(k)) keep.set(k, Q.get(k)); });
  keep.set('c', code); u.search = keep.toString(); u.hash = ''; return u.toString();
}
function keepRegistered(getPeer){
  const check = () => { const p = getPeer(); if(p && !p.destroyed && p.disconnected){ try{ p.reconnect(); }catch(e){} } };
  setInterval(check, 4000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') check(); });
}

/* ======================================================================
   START
   ====================================================================== */
function landing(){
  app.innerHTML = `<div class="land sk">
    <h1 style="margin:.1em 0">📊 Umfrage live</h1>
    <p class="muted" style="margin-top:0">Wie nutzt unsere Klasse das Netz? Anonym, am Beamer, mit dem eigenen Gerät.</p>
    <div class="two">
      <div class="opt sk"><div style="font-size:2.4rem">📽️</div><h2>Lehrkraft</h2><p class="muted small">Zeigt die Umfrage am Beamer und klickt weiter.</p><button class="go big" id="bHost">Umfrage starten</button></div>
      <div class="opt sk"><div style="font-size:2.4rem">📱</div><h2>Schüler/in</h2><p class="muted small">Code vom Beamer eingeben (oder QR-Code scannen).</p>
        <input id="inCode" class="code" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters"><br><br><button class="go" id="bJoin">Mitmachen</button></div>
    </div></div>`;
  $('bHost').onclick = hStart;
  const join = () => { const c = $('inCode').value.trim().toUpperCase(); if(c.length === 4) cStart(c); else $('inCode').focus(); };
  $('bJoin').onclick = join; $('inCode').onkeydown = e => { if(e.key === 'Enter') join(); };
}

/* ======================================================================
   HOST (Beamer)
   ====================================================================== */
const H = { code:'', peer:null, phase:'lobby', qi:-1, players:new Map(), votes: QS.map(() => new Map()), final: QS.map(() => null) };
const online = () => [...H.players.values()].filter(p => p.conn && p.conn.open).length;
const countsOf = qi => { const c = QS[qi].opts.map(() => 0); H.votes[qi].forEach(a => { if(c[a] !== undefined) c[a]++; }); return c; };

function hStart(){
  hOpenPeer();
  hRender();
  window.addEventListener('beforeunload', e => { if(H.phase !== 'lobby'){ e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){ e.preventDefault(); hNext(); }
    else if(e.key.toLowerCase() === 'f'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  });
}
function hOpenPeer(){
  H.code = rnd(4);
  const peer = new Peer(PREFIX + H.code, PEER_OPTS); H.peer = peer;
  peer.on('open', () => { H.ready = true; if(H.phase === 'lobby') hRender(); });
  peer.on('connection', conn => {
    conn.on('data', m => hOnMsg(conn, m));
    conn.on('close', () => { for(const p of H.players.values()) if(p.conn === conn) p.conn = null; hUpdate(); });
  });
  peer.on('error', err => {
    if(err.type === 'unavailable-id'){ try{ peer.destroy(); }catch(e){} hOpenPeer(); return; }
    H.err = err.type; if(H.phase === 'lobby') hRender();
  });
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
  if(!H.keep){ H.keep = true; keepRegistered(() => H.peer); }
}
function hPub(p){
  const m = {t:'state', phase:H.phase, qi:H.qi, n:QS.length};
  if(H.phase === 'q' || H.phase === 'r'){
    const q = QS[H.qi]; m.q = {q:q.q, opts:q.opts, cols:q.cols}; const v = H.votes[H.qi].get(p.pid); m.my = v === undefined ? null : v;
    if(H.phase === 'r'){ m.counts = countsOf(H.qi); m.info = q.info; }
  }
  return m;
}
function hSend(p){ if(p.conn && p.conn.open) try{ p.conn.send(hPub(p)); }catch(e){} }
function hBroadcast(){ H.players.forEach(hSend); }
function hOnMsg(conn, m){
  if(!m || typeof m !== 'object') return;
  if(m.t === 'hello' && typeof m.pid === 'string'){
    const pid = m.pid.slice(0, 16); let p = H.players.get(pid);
    if(!p){ p = {pid}; H.players.set(pid, p); }
    p.conn = conn; hSend(p); hUpdate();
  } else if(m.t === 'vote'){
    const p = [...H.players.values()].find(x => x.conn === conn); if(!p) return;
    if(H.phase !== 'q' || m.qi !== H.qi) return;
    if(!Number.isInteger(m.a) || m.a < 0 || m.a >= QS[H.qi].opts.length) return;
    H.votes[H.qi].set(p.pid, m.a); hSend(p); hUpdate();
  }
}
function hNext(){
  if(!H.ready) return;
  if(H.phase === 'lobby'){ if(!online()) return; H.phase = 'q'; H.qi = 0; }
  else if(H.phase === 'q'){ H.phase = 'r'; H.final[H.qi] = countsOf(H.qi); }
  else if(H.phase === 'r'){ if(H.qi + 1 < QS.length){ H.phase = 'q'; H.qi++; } else H.phase = 'end'; }
  else return;
  hBroadcast(); hRender();
}
function hUpdate(){   // leichte Aktualisierung ohne komplettes Neuzeichnen
  const n = online();
  ['hOnline','hOnline2'].forEach(id => { const e = $(id); if(e) e.textContent = n; });
  const av = $('hAvs'); if(av) av.innerHTML = [...H.players.values()].map(p => `<span class="av ${p.conn && p.conn.open ? '' : 'off'}">${emojiOf(p.pid)}</span>`).join('');
  const go = $('hGo'); if(go) go.disabled = !n;
  if(H.phase === 'q'){
    const got = H.votes[H.qi].size, tot = Math.max(n, got);
    const t = $('hGot'); if(t) t.textContent = got + ' von ' + tot;
    const f = $('hProg'); if(f) f.style.width = (tot ? got/tot*100 : 0) + '%';
  }
}
function hTop(label){
  return `<div class="top noprint"><span class="ti">📊 Umfrage live</span><span class="chip">${label}</span><span class="sp"></span>
    <span class="chip">📱 <span id="hOnline">${online()}</span></span>
    <button class="ghost" id="bDark" title="Hell/Dunkel">🌓</button><button class="ghost" id="bFs" title="Vollbild (F)">⛶</button></div>`;
}
function hBind(){
  const d = $('bDark'); if(d) d.onclick = () => document.body.classList.toggle('dark');
  const f = $('bFs'); if(f) f.onclick = () => { if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
  const g = $('hGo'); if(g) g.onclick = hNext;
}
function hRender(){
  if(H.phase === 'lobby') return hLobby();
  if(H.phase === 'q') return hQuestion();
  if(H.phase === 'r') return hResult();
  hEnd();
}
function hLobby(){
  const url = joinUrl(H.code);
  let qr = ''; try{ const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q.createSvgTag({cellSize:6, margin:2, scalable:true}); }catch(e){}
  app.innerHTML = hTop('Warteraum') + `<div class="lobby">
    <div class="joinbox sk">
      ${H.ready ? `<div class="muted">Öffne auf deinem Gerät</div><div style="font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:700;word-break:break-all">${esc(location.host + location.pathname.replace(/index\.html$/, ''))}</div>
      <div class="muted">und gib den Code ein:</div><div class="bigcode">${H.code}</div><div class="qr">${qr}</div><div class="muted small">oder QR-Code scannen</div>`
      : `<div style="font-size:1.4rem;padding:30px">${H.err ? '⚠️ Verbindungsproblem: ' + esc(H.err) : 'Verbinde …'}</div>`}
    </div>
    <div class="who sk"><h2 style="margin:.1em 0">📱 <span id="hOnline2">${online()}</span> dabei</h2>
      <div class="muted">Die Umfrage ist <b>anonym</b>: Niemand sieht, wer was antwortet. Es gibt kein Richtig oder Falsch.</div>
      <div class="avs" id="hAvs"></div>
      <div style="margin-top:18px"><button class="go big" id="hGo" ${online() ? '' : 'disabled'}>Los geht's →</button> <span class="muted small">Leertaste oder Klick</span></div></div></div>`;
  hBind(); hUpdate();
}
function tilesHtml(q, cls){
  return `<div class="tiles n${q.opts.length}">` + q.opts.map((o, i) => `<div class="tile sk c${q.cols[i]} ${cls||''}"><span class="sh">${SHAPES[i]}</span><span>${esc(o)}</span></div>`).join('') + '</div>';
}
function hQuestion(){
  const q = QS[H.qi];
  app.innerHTML = hTop('Frage ' + (H.qi+1) + ' von ' + QS.length) + `<div class="qcard sk"><div class="qno">Wähle auf deinem Gerät. Du kannst deine Antwort noch ändern.</div><div class="qq">${esc(q.q)}</div></div>
    ${tilesHtml(q)}
    <div class="center"><div class="prog"><i id="hProg"></i></div><div><b id="hGot">0 von 0</b> haben geantwortet</div>
    <p><button class="go big" id="hGo">Ergebnis zeigen →</button> <span class="muted small">Leertaste oder Klick</span></p></div>`;
  hBind(); hUpdate();
}
function barsHtml(q, counts, animate){
  const tot = counts.reduce((a, b) => a + b, 0), max = Math.max(...counts);
  return `<div class="bars">` + q.opts.map((o, i) => {
    const pct = tot ? Math.round(counts[i]/tot*100) : 0;
    return `<div class="bar ${counts[i] === max && max > 0 ? 'top' : ''}"><div class="lb">${SHAPES[i]} ${esc(o)}</div>
      <div class="tr"><div class="fill c${q.cols[i]}" data-w="${tot ? counts[i]/tot*100 : 0}" style="width:${animate ? 0 : (tot ? counts[i]/tot*100 : 0)}%"></div><span class="val">${counts[i]} · ${pct} %</span></div></div>`;
  }).join('') + `</div>`;
}
function hResult(){
  const q = QS[H.qi], c = H.final[H.qi], tot = c.reduce((a, b) => a + b, 0);
  app.innerHTML = hTop('Ergebnis ' + (H.qi+1) + ' von ' + QS.length) + `<div class="qcard sk"><div class="qq">${esc(q.q)}</div><div class="qno">${tot} Antworten</div></div>
    ${barsHtml(q, c, true)}
    <div class="info sk">💬 ${esc(q.info)}</div>
    <div class="center"><button class="go big" id="hGo">${H.qi + 1 < QS.length ? 'Weiter →' : 'Zusammenfassung →'}</button> <span class="muted small">Leertaste oder Klick</span></div>`;
  hBind(); hUpdate();
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.fill').forEach(f => { f.style.width = f.dataset.w + '%'; })));
}
function hEnd(){
  const rows = QS.map((q, i) => {
    const c = H.final[i] || q.opts.map(() => 0), tot = c.reduce((a, b) => a + b, 0);
    const seg = c.map((n, k) => n ? `<i class="c${q.cols[k]}" style="width:${n/tot*100}%">${Math.round(n/tot*100)} %</i>` : '').join('');
    const leg = q.opts.map((o, k) => `<span class="dot c${q.cols[k]}"></span>${esc(o)}`).join('');
    return `<div class="sumrow sk"><div class="q">${i+1}. ${esc(q.q)}</div><div class="stack">${seg}</div><div class="legend">${leg} <span class="muted">(${tot} Antworten)</span></div></div>`;
  }).join('');
  app.innerHTML = hTop('Zusammenfassung') + `<h1 style="margin:.2em 0">🌍 Unsere Klasse in Zahlen</h1><p class="muted">Anonym · ${new Date().toLocaleDateString('de-DE')} · ${online()} Teilnehmende online am Ende</p>${rows}
    <div class="center noprint" style="margin:14px"><button class="go big" id="bPrint">🖨️ Drucken</button></div>`;
  hBind(); $('bPrint').onclick = () => window.print();
}

/* ======================================================================
   CLIENT (Handy / PC der Kinder)
   ====================================================================== */
const C = { code:'', pid:'', conn:null, peer:null, st:null, gen:0, status:'Verbinde …' };
function getPid(){
  try{ let p = sessionStorage.getItem('itgumfrage-pid'); if(!p){ p = rnd(10); sessionStorage.setItem('itgumfrage-pid', p); } return p; }catch(e){ return rnd(10); }
}
function cStart(code){
  C.code = code; C.pid = getPid(); C.gen++;
  cRender();
  cConnect();
}
function cConnect(){
  const gen = ++C.gen; clearTimeout(C.t); try{ C.peer && C.peer.destroy(); }catch(e){}
  C.status = 'Verbinde …'; cRender();
  const retry = (ms, msg) => { if(gen !== C.gen) return; C.status = msg; cRender(); clearTimeout(C.t); C.t = setTimeout(() => { if(gen === C.gen) cConnect(); }, ms); };
  const peer = new Peer(undefined, PEER_OPTS); C.peer = peer;
  C.t = setTimeout(() => { if(gen === C.gen && !(C.conn && C.conn.open)) retry(500, 'Dauert länger als sonst … prüfe den Code.'); }, 15000);
  peer.on('open', () => {
    if(gen !== C.gen) return;
    const conn = peer.connect(PREFIX + C.code, {reliable:true}); C.conn = conn;
    conn.on('open', () => { if(gen !== C.gen) return; clearTimeout(C.t); conn.send({t:'hello', pid:C.pid}); });
    conn.on('data', m => { if(gen === C.gen) cOnMsg(m); });
    conn.on('close', () => retry(1500, 'Verbindung verloren – verbinde neu …'));
    conn.on('error', () => retry(1500, 'Verbindung gestört – verbinde neu …'));
  });
  peer.on('error', err => { if(gen !== C.gen) return; retry(err.type === 'peer-unavailable' ? 3000 : 2000, err.type === 'peer-unavailable' ? 'Code nicht gefunden. Stimmt der Code? Ich versuche es weiter …' : 'Netzwerkproblem – ich versuche es neu …'); });
}
function cOnMsg(m){ if(m && m.t === 'state'){ C.st = m; cRender(); } else if(m && m.t === 'closed'){ C.st = null; C.status = 'Die Umfrage ist beendet.'; cRender(); } }
function cVote(a){
  const s = C.st; if(!s || s.phase !== 'q' || !C.conn || !C.conn.open) return;
  try{ C.conn.send({t:'vote', qi:s.qi, a}); }catch(e){}
}
function cRender(){
  const s = C.st;
  let body;
  if(!s){
    body = `<div class="status sk"><div class="em">📡</div><h2>${esc(C.status)}</h2><p class="muted">Code: <b>${esc(C.code)}</b></p><button class="ghost" id="cBack">Anderen Code eingeben</button></div>`;
  } else if(s.phase === 'lobby'){
    body = `<div class="status sk"><div class="em">${emojiOf(C.pid)}</div><h2>Du bist dabei!</h2><p class="muted">Warte, bis die Lehrkraft startet. Die Umfrage ist anonym.</p></div>`;
  } else if(s.phase === 'q'){
    const q = s.q;
    body = `<div class="muted small center">Frage ${s.qi+1} von ${s.n}</div><div class="qcard sk"><div class="qq">${esc(q.q)}</div></div>
      <div class="tiles" style="grid-template-columns:1fr">` + q.opts.map((o, i) =>
      `<button class="tile sk c${q.cols[i]} ${s.my === i ? 'sel' : (s.my !== null ? 'dim' : '')}" data-i="${i}"><span class="sh">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('') + `</div>
      <p class="center muted">${s.my === null ? 'Tippe auf deine Antwort.' : '✅ Gesendet. Du kannst noch ändern.'}</p>`;
  } else if(s.phase === 'r'){
    const tot = s.counts.reduce((a, b) => a + b, 0), mine = s.my;
    body = `<div class="status sk"><div class="em">👀</div><h2>Schau zum Beamer</h2>
      ${mine !== null ? `<p>Du hast <b>${esc(s.q.opts[mine])}</b> gewählt. ${tot ? Math.round(s.counts[mine]/tot*100) : 0} % der Klasse auch.</p>` : '<p class="muted">Du hast nicht geantwortet.</p>'}</div>`;
  } else {
    body = `<div class="status sk"><div class="em">🎉</div><h2>Danke fürs Mitmachen!</h2><p class="muted">Die Ergebnisse siehst du am Beamer.</p></div>`;
  }
  app.innerHTML = `<div class="cl"><div class="top"><span class="ti">📊 Umfrage live</span><span class="sp"></span><button class="ghost" id="bDark">🌓</button></div>${body}</div>`;
  const d = $('bDark'); if(d) d.onclick = () => document.body.classList.toggle('dark');
  const b = $('cBack'); if(b) b.onclick = () => { C.gen++; clearTimeout(C.t); try{ C.peer && C.peer.destroy(); }catch(e){} history.replaceState(null, '', location.pathname); landing(); };
  app.querySelectorAll('button.tile').forEach(t => t.onclick = () => cVote(+t.dataset.i));
}

/* ---------- Einstieg ---------- */
const c0 = (Q.get('c') || '').toUpperCase();
if(/^[A-Z0-9]{4}$/.test(c0)) cStart(c0); else landing();
</script>
